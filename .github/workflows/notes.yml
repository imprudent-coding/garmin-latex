name: notes

# LaTeX -> PDF + notes-bundle.zip -> Release "notes-*".
# Le Release si pubblicano solo dal branch principale (o a mano con "release").
on:
  push:
    paths:
      - "latex/**"
      - "pipeline/**"
      - "shared/**"
      - ".github/workflows/notes.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Pubblica una Release anche da un branch diverso dal principale"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.0.0

      # TeX Live 2023 e pandoc 3.1.3 dai pacchetti di Ubuntu 24.04 (versioni fissate dall'immagine)
      - name: Installa TeX Live, pandoc e poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures latexmk lmodern \
            pandoc poppler-utils
          pdflatex --version | head -1
          pandoc --version | head -1

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dipendenze Python
        run: pip install -r pipeline/requirements.txt

      - name: Test della pipeline
        working-directory: pipeline
        run: python -m pytest -q tests

      - name: Font aggiornati?
        working-directory: pipeline
        run: |
          python -m gwnotes.fontgen
          git diff --exit-code -- '../shared/font/generated/*.fnt' ../shared/font/generated/metrics.json \
            ../shared/font/generated/fonts.xml ../garmin/source/FontInfo.mc \
            || { echo "::error::I font generati non corrispondono a shared/font (esegui python -m gwnotes.fontgen e fai commit)"; exit 1; }

      - name: Conversione
        id: build
        working-directory: pipeline
        run: |
          VERSION="$(date -u +%Y%m%d.%H%M%S)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # indirizzo dei file web su GitHub Pages (l'orologio li scarica da lì, il
          # telefono resta la riserva); NOTES_WEB_BASE lo sostituisce (dominio proprio)
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.NOTES_WEB_BASE }}" ]; then
            WEB_BASE="${{ vars.NOTES_WEB_BASE }}"
          elif [ "${REPO,,}" = "$OWNER.github.io" ]; then
            WEB_BASE="https://$OWNER.github.io/w/"
          else
            WEB_BASE="https://$OWNER.github.io/$REPO/w/"
          fi
          python -m gwnotes build --latex ../latex --out ../dist --version "$VERSION" --preview 16 \
            --web-base "$WEB_BASE"
          cat ../dist/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Anteprime, report e bundle (artifact)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: notes-${{ steps.build.outputs.version || github.run_number }}
          path: |
            dist/preview/
            dist/report.md
            dist/notes-bundle.zip
            dist/notes.pdf
          if-no-files-found: warn
          retention-days: 30

      # file per GitHub Pages (solo dal branch principale, come la Release)
      - name: File web per GitHub Pages
        if: >-
          success() && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || inputs.release)
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/web

      - name: Pubblica la Release
        if: >-
          success() && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || inputs.release)
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: notes-${{ steps.build.outputs.version }}-${{ github.run_number }}
          name: Appunti ${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/report.md
          files: |
            dist/notes-bundle.zip
            dist/notes.pdf
            dist/manifest.json

  # Pubblica i file web su GitHub Pages. Va attivato una volta: Settings → Pages →
  # Source: GitHub Actions. Se non lo è, questo job fallisce senza bloccare il
  # resto: l'orologio scarica tutto dal telefono come prima.
  pages:
    needs: build
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.release
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4.0.5

name: notes

# LaTeX -> PDF + notes-bundle.zip -> Release "notes-*".
# Le Release si pubblicano solo dal branch principale (o a mano con "release").
# Il bundle comprende anche le simulazioni d'esame (PDF formato orologio) della
# repository EXAMS_REPO (variabile, default imprudent-coding/Gasdynamics-fork):
# si aggiornano ogni 6 ore, a mano, o subito con un repository_dispatch "esami".
# Nelle esecuzioni programmate o da dispatch la Release si pubblica solo se i
# contenuti sono cambiati. Se cambiano solo gli esami la build è incrementale
# (vedi "Release precedente e tipo di build").
on:
  push:
    # solo branch: i tag (es. garmin-v*) non cambiano gli appunti
    branches:
      - "**"
    paths:
      - "latex/**"
      - "pipeline/**"
      - "shared/**"
      - ".github/workflows/notes.yml"
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [esami]
  workflow_dispatch:
    inputs:
      release:
        description: "Pubblica una Release anche da un branch diverso dal principale"
        type: boolean
        default: false
      completa:
        description: "Build completa (riconverte anche gli appunti, senza riusare l'ultima Release)"
        type: boolean
        default: false
      esami_ref:
        description: "Branch delle simulazioni d'esame da usare (vuoto: EXAMS_REF o il branch principale)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.changed.outputs.publish }}
    steps:
      - uses: actions/checkout@v5.0.0

      # Build incrementale: se appunti, pipeline e font sono quelli dell'ultima Release
      # (stessa impronta "inputs" nel suo manifest), gli appunti si copiano dal suo bundle
      # e si convertono solo gli esami nuovi o cambiati: niente TeX Live né pandoc (~10 s
      # invece di 2-4 minuti). "Run workflow" con "completa" forza la build completa.
      - name: Release precedente e tipo di build
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          inputs="$(git rev-parse HEAD:latex HEAD:pipeline HEAD:shared HEAD:.github/workflows/notes.yml | sha256sum | cut -c1-16)"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          mode=full
          # ultima Release degli appunti (tag notes-*), come l'app Android: le Release
          # dell'app orologio (garmin-v*) non hanno il bundle
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
                   --jq '[.[] | select(.tagName | startswith("notes-"))][0].tagName // ""')"
          echo "Release precedente: ${tag:-nessuna}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$tag" ] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern notes-bundle.zip \
               --pattern notes.pdf --pattern manifest.json --dir prev 2>/dev/null; then
            old="$(python3 -c 'import json;print(json.load(open("prev/manifest.json")).get("inputs",""))')"
            if [ "$old" = "$inputs" ] && [ "${{ inputs.completa }}" != "true" ]; then
              mode=incremental
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Build: $mode (ingressi $inputs)" >> "$GITHUB_STEP_SUMMARY"

      # pacchetti .deb scaricati una volta e tenuti in cache: lo specchio di Ubuntu a
      # volte è lentissimo (anche decine di minuti per TeX Live)
      - name: Cache dei pacchetti
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache@v4.2.4
        with:
          path: ~/apt-cache
          key: apt-texlive-${{ runner.os }}-${{ runner.arch }}-v1

      # TeX Live 2023 e pandoc 3.1.3 dai pacchetti di Ubuntu 24.04 (versioni fissate dall'immagine)
      - name: Installa TeX Live, pandoc e poppler
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 22
        run: |
          # lo specchio a volte si blocca: ogni tentativo ha un tempo massimo, poi si riprova
          # (i pacchetti già scaricati restano in ~/apt-cache)
          APT=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          mkdir -p ~/apt-cache/partial
          ok=""
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get "${APT[@]}" update -q \
              && timeout 300 sudo apt-get "${APT[@]}" -o Dir::Cache::Archives="$HOME/apt-cache" install -y -q \
                   --no-install-recommends \
                   texlive-latex-base texlive-latex-recommended texlive-latex-extra \
                   texlive-fonts-recommended texlive-pictures latexmk lmodern \
                   pandoc poppler-utils; then
              ok=1
              break
            fi
            echo "::warning::Installazione dei pacchetti: tentativo $attempt non riuscito, riprovo"
            sudo dpkg --configure -a || true
          done
          [ -n "$ok" ] || { echo "::error::Specchio di Ubuntu non raggiungibile dopo 3 tentativi: rilancia il workflow"; exit 1; }
          sudo chown -R "$USER" ~/apt-cache
          rm -rf ~/apt-cache/partial ~/apt-cache/lock
          pdflatex --version | head -1
          pandoc --version | head -1

      - name: Installa poppler (build incrementale)
        if: steps.mode.outputs.mode == 'incremental'
        timeout-minutes: 5
        run: |
          command -v pdftoppm || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils; }
          pdftoppm -v 2>&1 | head -1

      # simulazioni d'esame: solo i PDF formato orologio. Repository privata: secret
      # EXAMS_TOKEN (token con lettura dei contenuti); senza, si prosegue senza esami.
      - name: Simulazioni d'esame
        id: exams
        continue-on-error: true
        uses: actions/checkout@v5.0.0
        with:
          repository: ${{ vars.EXAMS_REPO || 'imprudent-coding/Gasdynamics-fork' }}
          ref: ${{ inputs.esami_ref || vars.EXAMS_REF || '' }}
          token: ${{ secrets.EXAMS_TOKEN || github.token }}
          path: exams-src
          sparse-checkout: simulazione_esame
          persist-credentials: false

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dipendenze Python
        run: pip install -r pipeline/requirements.txt

      - name: Test della pipeline
        working-directory: pipeline
        run: python -m pytest -q tests

      - name: Font aggiornati?
        working-directory: pipeline
        run: |
          python -m gwnotes.fontgen
          git diff --exit-code -- '../shared/font/generated/*.fnt' ../shared/font/generated/metrics.json \
            ../shared/font/generated/fonts.xml ../garmin/source/FontInfo.mc \
            || { echo "::error::I font generati non corrispondono a shared/font (esegui python -m gwnotes.fontgen e fai commit)"; exit 1; }

      - name: Conversione
        id: build
        working-directory: pipeline
        run: |
          VERSION="$(date -u +%Y%m%d.%H%M%S)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # indirizzo dei file web su GitHub Pages (l'orologio li scarica da lì, il
          # telefono resta la riserva); NOTES_WEB_BASE lo sostituisce (dominio proprio)
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.NOTES_WEB_BASE }}" ]; then
            WEB_BASE="${{ vars.NOTES_WEB_BASE }}"
          elif [ "${REPO,,}" = "$OWNER.github.io" ]; then
            WEB_BASE="https://$OWNER.github.io/w/"
          else
            WEB_BASE="https://$OWNER.github.io/$REPO/w/"
          fi
          EXAMS=""
          if [ -d ../exams-src/simulazione_esame ]; then
            EXAMS="$(cd ../exams-src/simulazione_esame && pwd)"
          elif [ "${{ steps.exams.outcome }}" = success ]; then
            echo "::warning::Nessuna cartella simulazione_esame nel branch scelto della repository degli esami"
          else
            echo "::warning::Repository degli esami non leggibile (privata senza EXAMS_TOKEN?)"
          fi
          ARGS=(--inputs "${{ steps.mode.outputs.inputs }}")
          # esami già convertiti nell'ultima Release: si riusano (anche nella build completa)
          [ -f ../prev/notes-bundle.zip ] && ARGS+=(--reuse ../prev/notes-bundle.zip)
          if [ "${{ steps.mode.outputs.mode }}" = incremental ]; then
            ARGS+=(--notes-from-reuse)
            mkdir -p ../dist && cp ../prev/notes.pdf ../dist/notes.pdf
          fi
          python -m gwnotes build --latex ../latex --out ../dist --version "$VERSION" --preview 16 \
            --web-base "$WEB_BASE" --exams "$EXAMS" "${ARGS[@]}"
          cat ../dist/report.md >> "$GITHUB_STEP_SUMMARY"

      # esecuzioni programmate o da dispatch: si pubblica solo se il contentHash è
      # cambiato rispetto all'ultima Release (altrimenti una Release ogni 6 ore)
      - name: Contenuti cambiati?
        id: changed
        run: |
          publish=true
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = repository_dispatch ]; then
            new="$(python3 -c 'import json;print(json.load(open("dist/manifest.json"))["contentHash"])')"
            old=""
            [ -f prev/manifest.json ] && old="$(python3 -c 'import json;print(json.load(open("prev/manifest.json"))["contentHash"])')"
            if [ "$new" = "$old" ]; then
              publish=false
              echo "Contenuti invariati ($new): niente Release" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Anteprime, report e bundle (artifact)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: notes-${{ steps.build.outputs.version || github.run_number }}
          path: |
            dist/preview/
            dist/report.md
            dist/notes-bundle.zip
            dist/notes.pdf
          if-no-files-found: warn
          retention-days: 30

      # file per GitHub Pages (solo dal branch principale, come la Release)
      - name: File web per GitHub Pages
        if: >-
          success() && steps.changed.outputs.publish == 'true'
          && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.release)
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/web

      - name: Pubblica la Release
        if: >-
          success() && steps.changed.outputs.publish == 'true'
          && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.release)
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: notes-${{ steps.build.outputs.version }}-${{ github.run_number }}
          name: Appunti ${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/report.md
          files: |
            dist/notes-bundle.zip
            dist/notes.pdf
            dist/manifest.json

  # Pubblica i file web su GitHub Pages. Va attivato una volta: Settings → Pages →
  # Source: GitHub Actions. Se non lo è, questo job fallisce senza bloccare il
  # resto: l'orologio scarica tutto dal telefono come prima.
  pages:
    needs: build
    if: >-
      needs.build.outputs.publish == 'true'
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.release)
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4.0.5

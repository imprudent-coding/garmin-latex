name: android

# APK dell'app companion. Firmato se ci sono i secrets del keystore,
# altrimenti APK di debug (con avviso). Sui tag "android-v*" crea la Release.
on:
  push:
    # con "tags" serve anche "branches", altrimenti il workflow parte solo sui tag
    branches:
      - "**"
    paths:
      - "android/**"
      - "shared/app-id.txt"
      - "shared/font/generated/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4.4.1

      - name: Keystore dai secrets
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=APK non firmato::Mancano i secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD: viene prodotto un APK di debug. Vedi README, sezione «Secrets»."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        id: apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            SRC=app/build/outputs/apk/release/app-release.apk
            NAME="appunti-garmin-${GITHUB_REF_NAME#android-v}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            SRC=app/build/outputs/apk/debug/app-debug.apk
            NAME="appunti-garmin-${GITHUB_REF_NAME#android-v}-debug.apk"
          fi
          NAME="$(echo "$NAME" | tr '/' '-')"
          mkdir -p out && cp "$SRC" "out/$NAME"
          echo "path=android/out/$NAME" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2.3.2
        with:
          # versioni 0.x (alfa) pubblicate come pre-release
          prerelease: ${{ startsWith(github.ref_name, 'android-v0.') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          name: App Android ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            APK dell'app companion. Installazione: vedi README, «Installare l'app Android».
            ${{ steps.sign.outputs.signed == 'true' && 'APK firmato con il keystore del progetto.' || 'ATTENZIONE: APK di debug (keystore non configurato).' }}
